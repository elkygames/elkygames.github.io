/* ==================== UTILS ==================== */
function slugify(t) {
  var s = String(t||"").toLowerCase().replace(/[^\w\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
  if (s.length > 60) s = s.substring(0,60).replace(/-$/,"");
  return s || "game";
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ==================== AUTO-GROWING RANDOM COUNTERS ==================== */
function getGameSeed(gameId) {
  var seed = 0;
  for (var i = 0; i < gameId.length; i++) {
    seed = ((seed << 5) - seed) + gameId.charCodeAt(i);
    seed = seed & seed;
  }
  return Math.abs(seed);
}
function generateRandomPlayerCount(gameId) {
  var now = new Date();
  var daysSinceUpload = Math.max(0, Math.floor((now - PAGE_RELEASE_DATE) / (1000 * 60 * 60 * 24)));
  var seed = getGameSeed(gameId);
  var growthPerDay = (seed % 50) + 20;
  var baseGrowth = daysSinceUpload * growthPerDay;
  var randomBoost = Math.floor(Math.random() * 400) + 100;
  var seedBoost = seed % 1000;
  var total = baseGrowth + randomBoost + seedBoost + 50;
  if (total > 500000) total = 500000 - Math.floor(Math.random() * 10000);
  return total;
}

    card.className = "game-card";
    card.setAttribute("data-href", slug);
    card.onclick = function() { window.location.href = card.getAttribute("data-href"); };
    if (currentViewMode === "cover" && hasVideo) {
      (function(v){ card.onmouseenter = function(){ handleMouseEnterCard(card, v); }; })(game.videoUrl);
      card.onmouseleave = function() { handleMouseLeaveCard(card); };
    }
    var imgHTML = '<div class="card-thumbnail-wrapper">' +
      '<img class="card-thumbnail" src="' + escapeHtml(displayImg) + '" alt="' + escapeHtml(game.title) + '" loading="lazy" onerror="this.src=\'https://via.placeholder.com/400x225/1a1a1e/666?text=Game\'">' +
      (hasVideo ? '<video class="card-hover-video" loop muted playsinline></video>' : "") +
      '</div>';
    var detailsHTML;
    if (isMobile) {
      detailsHTML = '<div class="card-details">' +
        '<div class="card-title">' + escapeHtml(game.title) + '</div>' +
        '<div class="card-submeta">' +
        '<span class="card-badge" style="background-color:' + game.badgeColor + '">' + escapeHtml(game.category || "Game") + '</span>' +
        '<div class="card-bottom-row-mobile">' +
        '<span class="card-views"><i class="fa-solid fa-users" style="color:var(--cyan-highlight)"></i> ' + plays.toLocaleString() + '</span>' +
        '<button class="card-like-btn ' + (isLiked?"liked":"") + '" data-id="' + escapeHtml(game.id) + '"><i class="fa-' + (isLiked?"solid":"regular") + ' fa-heart"></i></button>' +
        '</div></div></div>';
    } else {
      detailsHTML = '<div class="card-details">' +
        '<div class="card-title">' + escapeHtml(game.title) + '</div>' +
        '<div class="card-submeta">' +
        '<span class="card-badge" style="background-color:' + game.badgeColor + '">' + escapeHtml(game.category || "Game") + '</span>' +
        '<span class="card-views"><i class="fa-solid fa-users" style="color:var(--cyan-highlight)"></i> ' + plays.toLocaleString() + '</span>' +
        '<button class="card-like-btn ' + (isLiked?"liked":"") + '" data-id="' + escapeHtml(game.id) + '"><i class="fa-' + (isLiked?"solid":"regular") + ' fa-heart"></i></button>' +
        '</div></div>';
    }
    card.innerHTML = imgHTML + detailsHTML;
    frag.appendChild(card);
  });
  grid.appendChild(frag);
  grid.querySelectorAll(".card-like-btn").forEach(function(btn) {
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      toggleLike(btn.getAttribute("data-id"));
    });
  });
}
function handleMouseEnterCard(cardEl, videoUrl) {
  if (!videoUrl || videoUrl.trim() === "") return;
  var v = cardEl.querySelector(".card-hover-video");
  if (!v) return;
  v.style.display = "block";
  if (!v.src) v.src = videoUrl.trim();
  v.currentTime = 0;
  v.play().catch(function(){});
  v.style.opacity = "1";
}
function handleMouseLeaveCard(cardEl) {
  var v = cardEl.querySelector(".card-hover-video");
  if (!v) return;
  v.style.opacity = "0";
  v.pause();
}

function renderCategoriesBar(cats) {
  var bar = document.getElementById("categoriesBar");
  var html = '<button class="category-chip active" data-cat="__all__">All Games</button>';
  cats.forEach(function(c) {
    html += '<button class="category-chip" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
  });
  bar.innerHTML = html;
  bar.querySelectorAll(".category-chip").forEach(function(b) {
    b.addEventListener("click", function() {
      bar.querySelectorAll(".category-chip").forEach(function(x) { x.classList.remove("active"); });
      b.classList.add("active");
      var cat = b.getAttribute("data-cat");
      if (cat === "__all__") { selectedCategoryName = "All"; currentlyDisplayedGames = ALL_GAMES.slice(); }
      else { selectedCategoryName = cat; currentlyDisplayedGames = ALL_GAMES.filter(function(g) {
        var gs = (g.categories && g.categories.length) ? g.categories : [g.category];
        return gs.some(function(x) { return String(x).trim() === cat; });
      }); }
      renderGamesGrid();
    });
  });
}
function renderDrawerCategories(counts) {
  var el = document.getElementById("drawerCategoryList");
  var html = "";
  Object.keys(counts).sort().forEach(function(cat) {
    html += '<div class="drawer-category-item" data-cat="' + escapeHtml(cat) + '">' +
      '<span><i class="fa-solid fa-gamepad" style="color:var(--accent-color);margin-right:8px;"></i>' + escapeHtml(cat) + '</span>' +
      '<span class="drawer-category-count">' + counts[cat] + ' Games</span>' +
      '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll(".drawer-category-item").forEach(function(item) {
    item.addEventListener("click", function() {
      var cat = item.getAttribute("data-cat");
      selectedCategoryName = cat;
      currentlyDisplayedGames = ALL_GAMES.filter(function(g) {
        var gs = (g.categories && g.categories.length) ? g.categories : [g.category];
        return gs.some(function(x) { return String(x).trim() === cat; });
      });
      document.querySelectorAll(".category-chip").forEach(function(c) {
        if (c.getAttribute("data-cat") === cat) c.classList.add("active");
        else c.classList.remove("active");
      });
      renderGamesGrid();
      closeAllDrawers();
    });
  });
}
function setViewMode(mode) {
  if (currentViewMode === mode) return;
  currentViewMode = mode;
  var grid = document.getElementById("gamesGrid");
  if (mode === "cover") {
    grid.classList.remove("icon-mode"); grid.classList.add("cover-mode");
    document.getElementById("btnCoverView").classList.add("active");
    document.getElementById("btnIconView").classList.remove("active");
  } else {
    grid.classList.remove("cover-mode"); grid.classList.add("icon-mode");
    document.getElementById("btnIconView").classList.add("active");
    document.getElementById("btnCoverView").classList.remove("active");
  }
  renderGamesGrid();
}
function filterByTag(tag, el) {
  document.querySelectorAll(".icon-filter-btn").forEach(function(b) { b.classList.remove("active"); });
  if (el) el.classList.add("active");
  var list = ALL_GAMES.slice();
  if (tag === "Latest") list.sort(function(a,b){
    var ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
    var tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
    return tb - ta;
  });
  else if (tag === "Popular") list.sort(function(a,b){ return (b.playsCount||0)-(a.playsCount||0); });
  else if (tag === "Random") list.sort(function(){ return Math.random()-0.5; });
  else if (tag === "Liked") list = list.filter(function(g){ return likedGameIds.indexOf(g.id) !== -1; });
  else if (tag === "History") list = list.filter(function(g){ return historyGameIds.indexOf(g.id) !== -1; });
  currentlyDisplayedGames = list;
  renderGamesGrid();
}
function handleSearch() {
  var q = document.getElementById("searchInput").value.toLowerCase().trim();
  if (q === "") currentlyDisplayedGames = ALL_GAMES.slice();
  else currentlyDisplayedGames = ALL_GAMES.filter(function(g){
    if (g.title && g.title.toLowerCase().indexOf(q) !== -1) return true;
    var gs = (g.categories && g.categories.length) ? g.categories : [g.category];
    return gs.some(function(c){ return String(c).toLowerCase().indexOf(q) !== -1; });
  });
  renderGamesGrid();
}
function toggleLike(id) {
  var i = likedGameIds.indexOf(id);
  if (i !== -1) likedGameIds.splice(i, 1);
  else likedGameIds.push(id);
  try { localStorage.setItem("elky_liked_games", JSON.stringify(likedGameIds)); } catch(e){}
  renderGamesGrid();
}
function toggleSettingsDrawer() {
  document.getElementById("settingsDrawer").classList.toggle("open");
  document.getElementById("drawerOverlay").style.display = document.getElementById("settingsDrawer").classList.contains("open") ? "block" : "none";
}
function closeAllDrawers() {
  document.getElementById("settingsDrawer").classList.remove("open");
  document.getElementById("drawerOverlay").style.display = "none";
}
function togglePlaystoreModal() {
  var m = document.getElementById("playstoreModal");
  m.style.display = (m.style.display === "flex") ? "none" : "flex";
}
function closePlaystoreModal() { document.getElementById("playstoreModal").style.display = "none"; }
function handleOutsidePlaystoreClick(e) { if (e.target.id === "playstoreModal") closePlaystoreModal(); }
function togglePagesModal() {
  var m = document.getElementById("pagesModal");
  m.style.display = (m.style.display === "flex") ? "none" : "flex";
}
function closePagesModal() { document.getElementById("pagesModal").style.display = "none"; }
function handleOutsideModalClick(e) { if (e.target.id === "pagesModal") closePagesModal(); }
function renderAppsModal() {
  var c = document.getElementById("playstoreAppList");
  var html = "";
  APPS_DATA.forEach(function(app) {
    html += '<div class="playstore-app-card">' +
      '<img src="' + app.iconUrl + '" class="playstore-app-icon" alt="' + escapeHtml(app.appName) + '" onerror="this.style.display=\'none\'">' +
      '<div class="playstore-app-info">' +
      '<div class="playstore-app-title">' + escapeHtml(app.appName) + '</div>' +
      '<div class="playstore-app-desc">' + escapeHtml(app.subtitle) + '</div>' +
      '</div>' +
      '<a href="' + app.playStoreUrl + '" target="_blank" class="playstore-download-btn"><i class="fa-brands fa-google-play"></i></a>' +
      '</div>';
  });
  c.innerHTML = html;
}
window.addEventListener("resize", function() { renderGamesGrid(); });
</script>
</body>
